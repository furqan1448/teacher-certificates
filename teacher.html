<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>دخول المعلمة - شهادة اجتياز</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="page">

    <!-- تسجيل دخول المعلمة -->
    <section class="panel login-panel">

      <a class="back" href="index.html">
        ← الرئيسية
      </a>

      <h1>دخول المعلمة</h1>

      <p class="muted">
        أدخلي رقم الجوال وكلمة المرور الخاصة بك.
      </p>

      <form id="teacherForm">

        <label for="phone">
          رقم الجوال
        </label>

        <input
          id="phone"
          type="text"
          inputmode="numeric"
          autocomplete="tel"
          placeholder="05xxxxxxxx"
          required
        >

        <label for="password">
          كلمة المرور
        </label>

        <input
          id="password"
          type="text"
          maxlength="4"
          autocomplete="off"
          placeholder="مثال: K7M2"
          required
        >

        <button
          class="btn primary"
          type="submit"
        >
          عرض الشهادة
        </button>

        <div
          id="teacherMessage"
          class="message"
        ></div>

      </form>

    </section>


    <!-- =========================
         الشهادة
         ========================= -->

    <section
      id="certificateSection"
      class="certificate-wrap hidden"
    >

      <div
        id="certificate"
        class="certificate"
      >

        <img
          src="./certificate.png"
          alt="قالب الشهادة"
          class="certificate-image"
        >

        <div class="certificate-text">

          <div class="organization">
            جمعية فرقان لتحفيظ القرآن الكريم بالطائف
          </div>

          <div class="certificate-space"></div>

          <div class="teacher-line">
            تشهد الجمعية بأن الأستاذة الفاضلة
            <br>
            <span id="teacherName" class="dynamic-name"></span>
          </div>

          <div class="certificate-space-small"></div>

          <div class="main-text">
            قد اجتازت اختبار قياس بنجاح
          </div>

          <div class="certificate-space-small"></div>

          <div class="category-line">
            وصُنّفت ضمن الفئة المناسبة للتدريس:
            <br>
            <span id="teacherCategory" class="dynamic-category"></span>
          </div>

          <div class="certificate-space-small"></div>

          <div class="thanks">
            سائلين الله أن يوفقها ويبارك في جهدها
          </div>

        </div>

      </div>

      <div class="certificate-actions">
        <button id="downloadPdfBtn" class="btn primary" type="button">
          تحميل PDF
        </button>
        <button id="logoutBtn" class="btn secondary" type="button">
          تسجيل خروج
        </button>
      </div>

    </section>

  </main>

  <script src="teacher.js"></script>

</body>
</html>
