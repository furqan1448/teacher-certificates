<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>دخول المعلمة - شهادة اجتياز</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="page">

    <!-- تسجيل دخول المعلمة -->
    <section class="panel login-panel">

      <a class="back" href="index.html">
        ← الرئيسية
      </a>

      <h1>دخول المعلمة</h1>

      <p class="muted">
        أدخلي رقم الجوال وكلمة المرور الخاصة بك.
      </p>

      <form id="teacherForm">

        <label for="phone">
          رقم الجوال
        </label>

        <input
          id="phone"
          type="text"
          inputmode="numeric"
          autocomplete="tel"
          placeholder="05xxxxxxxx"
          required
        >

        <label for="password">
          كلمة المرور
        </label>

        <input
          id="password"
          type="text"
          maxlength="4"
          autocomplete="off"
          placeholder="مثال: K7M2"
          required
        >

        <button
          class="btn primary"
          type="submit"
        >
          عرض الشهادة
        </button>

        <div
          id="teacherMessage"
          class="message"
        ></div>

      </form>

    </section>


    <!-- =========================
         الشهادة
         ========================= -->

    <section
      id="certificateSection"
      class="certificate-wrap hidden"
    >

      <div
        id="certificate"
        class="certificate"
      >

        <!-- الخلفية -->
        <img
          src="./certificate.png"
          class="certificate-image"
          alt="شهادة اجتياز"
        >


        <!-- النص فوق الشهادة -->

        <div class="certificate-text">


          <div class="certificate-space"></div>


          <div class="teacher-line">
            الأستاذة الفاضلة/
            <span
              id="teacherName"
              class="dynamic-name"
            >
              اسم المعلمة
            </span>
          </div>


          <div class="certificate-space-small"></div>


          <div class="category-line">
            فئة التدريس:
            <span
              id="teacherCategory"
              class="dynamic-category"
            >
              الفئة
            </span>
          </div>


          <div class="certificate-space-small"></div>

        </div>

      </div>


      <!-- الأزرار -->

      <div class="certificate-actions">

        <button
          class="btn primary"
          id="downloadPdfBtn"
        >
          تحميل PDF
        </button>

        <button
          class="btn secondary"
          id="logoutBtn"
        >
          تسجيل خروج
        </button>

      </div>

    </section>

  </main>


  <script
    type="module"
    src="teacher.js"
  ></script>

</body>

</html>
